name: Capture Installer UI

on:
  workflow_dispatch:
  # workflow_dispatch 只认默认分支上的工作流文件；功能分支先用 push 触发。
  push:
    branches:
      - feat/installer-v0.1.1-feedback
    paths:
      - ".github/workflows/capture-installer-ui.yml"
      - "scripts/capture_installer_ui.py"
      - "gui_install.py"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot-backend
          ref: v0.1.1-alpha.1
          path: backend-src

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot-GUI
          ref: fix/setup-ux-and-stability
          path: gui-src

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot
          ref: main
          path: personas-src
          sparse-checkout: personas

      - name: Install Xvfb, GTK4 and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox imagemagick ffmpeg x11-utils \
            fonts-noto-cjk fonts-noto-color-emoji \
            python3 python3-venv python3-tk python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Prepare demo source
        run: |
          set -euo pipefail
          rm -rf demo-src
          mkdir demo-src
          cp -a backend-src/. demo-src/
          rm -rf demo-src/.git demo-src/.github demo-src/gui demo-src/webui demo-src/personas
          cp -a gui-src/gui demo-src/gui
          cp -a personas-src/personas demo-src/personas
          test -f "demo-src/personas/大肥鱼/persona_prompt.py"
          test -f demo-src/gui/plugin.json
          test -f demo-src/pyproject.toml

      - name: Run installer wizard and capture
        run: |
          set -euo pipefail
          mkdir -p artifacts
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          export DISPLAY=:99
          openbox >/tmp/openbox.log 2>&1 &
          sleep 1
          python3 scripts/capture_installer_ui.py \
            --source demo-src \
            --install-dir /tmp/kb-installer-demo \
            --out artifacts \
            --screen 1280x800

      - name: Show captured files
        if: always()
        run: |
          find artifacts -maxdepth 2 -type f -printf '%P %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-ui-demo
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 7
