name: Build Installer

on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Windows GUI 便携包使用的 KarenBot-backend tag"
        required: false
        default: "v0.1.1-alpha.1"
      gui_tag:
        description: "Windows GUI 便携包使用的 KarenBot-GUI tag/分支"
        required: false
        default: "fix/setup-ux-and-stability"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "karen_install.py"
      - "gui_install.py"
      - "mirrors.json"
      - "windows-gui-package.json"
      - "KarenBot-Installer.spec"
      - "install.sh"
      - "requirements-build.txt"
      - "requirements-test.txt"
      - "packaging/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_TAG: ${{ github.event.inputs.backend_tag || 'v0.1.1-alpha.1' }}
  # GUI 首次配置/控制台修复尚未合并到 GUI main；默认使用功能分支，
  # 确保 tag 构建不会悄悄回退到旧 GUI。合并后改成新的 GUI tag。
  GUI_TAG: ${{ github.event.inputs.gui_tag || 'fix/setup-ux-and-stability' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile sources
        run: python -m compileall -q karen_install.py gui_install.py scripts/

      - name: Shell syntax
        run: bash -n install.sh

      - name: Ruff
        run: python -m ruff check karen_install.py gui_install.py scripts/ tests/

      - name: Installer tests
        run: |
          python -m pytest tests/test_installer.py \
            tests/test_installer_gui_contract.py \
            tests/test_windows_packaging.py -q

  build-windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-test.txt

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Installer tests on Windows
        run: python -m pytest tests/test_installer.py tests/test_windows_packaging.py -q

      - name: Build installer (pinned toolchain)
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Enforce 60 MiB artifact limit
        run: python scripts/check_artifact_size.py dist/KarenBot-Installer.exe --max-mib 60

      - name: Verify x64 artifact, version and SHA256
        shell: pwsh
        run: ./scripts/verify_windows_artifact.ps1

      - name: Smoke check frozen exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KarenBot-Installer.exe" `
            -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "--check failed with exit code $($p.ExitCode)"
          }

      - name: Capture Windows installer UI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\KarenBot-Installer.exe"
          $png = Join-Path $PWD "installer-ui.png"
          $pngLate = Join-Path $PWD "installer-ui-late.png"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32Capture {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          "@

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if (-not $process.HasExited) {
              $process.Refresh()
          }
          Write-Host "Launcher PID=$($process.Id) Exited=$($process.HasExited)"

          $gui = Get-Process -Name "KarenBot-Installer" -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } |
              Select-Object -First 1
          if ($gui) {
              Write-Host "GUI PID=$($gui.Id) Title=$($gui.MainWindowTitle)"
              [Win32Capture]::ShowWindow($gui.MainWindowHandle, 3) | Out-Null
              [Win32Capture]::SetForegroundWindow($gui.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 1
          } else {
              Write-Host "No GUI window handle found; capturing desktop anyway."
          }

          function Save-Screen([string]$path) {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                  $graphics.CopyFromScreen(
                      $bounds.Location,
                      [System.Drawing.Point]::Empty,
                      $bounds.Size
                  )
                  $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                  $graphics.Dispose()
                  $bitmap.Dispose()
              }
          }

          Save-Screen $png
          Start-Sleep -Seconds 3
          Save-Screen $pngLate
          Get-Process -Name "KarenBot-Installer" -ErrorAction SilentlyContinue |
              Stop-Process -Force
          Get-Item $png, $pngLate | Select-Object Name, Length | Format-Table

      - name: Upload Windows installer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-ui
          path: |
            installer-ui.png
            installer-ui-late.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: |
            dist/KarenBot-Installer.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  build-windows-bundle:
    # 这是大体积 GTK4 运行时打包，只在手动触发/tag 时跑，PR 不跑。
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot-backend
          ref: ${{ env.BACKEND_TAG }}
          path: backend

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot-GUI
          ref: ${{ env.GUI_TAG }}
          path: gui-src

      # backend 仓库的 personas/ 是空壳，真实人格在主仓库；只取这个目录。
      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot
          ref: main
          path: personas-src
          sparse-checkout: personas

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download gvsbuild GTK4 runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "GTK4_Gvsbuild_2026.8.0_x64.zip"
          gh release download 2026.8.0 -R wingtk/gvsbuild `
            -p "GTK4_Gvsbuild_2026.8.0_x64.zip" -D $env:RUNNER_TEMP --clobber
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne "1f95a92d037f5292da05e6ab1037032ff21ddb7b20d4ac8e83e3674c864c07b0") {
            throw "gvsbuild sha256 mismatch: $hash"
          }

      - name: Download Python 3.14 portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "python314.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.14.10%2B20261110-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne "32b6cf90a03e2bc15fda8d2ab7ff78c4870f138887d612932650ce764efaab8f") {
            throw "python runtime sha256 mismatch: $hash"
          }

      - name: Build Windows GTK4 portable bundle
        run: |
          python scripts/build_windows_bundle.py `
            --gvsbuild-zip "$env:RUNNER_TEMP\GTK4_Gvsbuild_2026.8.0_x64.zip" `
            --python-archive "$env:RUNNER_TEMP\python314.tar.gz" `
            --backend-dir backend --gui-dir gui-src `
            --personas-dir personas-src/personas --personas-tag main `
            --out KarenBot-Windows-x64.zip `
            --backend-tag "$env:BACKEND_TAG" --gui-tag "$env:GUI_TAG"

      - name: Show bundle
        shell: pwsh
        run: |
          Get-Item KarenBot-Windows-x64.zip |
            Select-Object Name, Length, @{N="MiB";E={[math]::Round($_.Length/1MB,1)}}

      - name: Install bundle with installer core
        run: |
          python karen_install.py --frontend gui `
            --archive KarenBot-Windows-x64.zip `
            --dir "$env:RUNNER_TEMP\kb-install" `
            --no-fonts --no-shortcut --gui-skin karen --renderer auto `
            --non-interactive

      - name: Run installed GUI launcher
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "kb-install"
          $normal = Join-Path $install "launch-gui.cmd"
          $safe = Join-Path $install "launch-gui-safe.cmd"
          if (-not (Test-Path $normal)) { throw "launcher missing: $normal" }
          if (-not (Test-Path $safe)) { throw "safe launcher missing: $safe" }
          $normalText = Get-Content $normal -Raw
          if ($normalText -notmatch "pythonw\.exe") {
            throw "launch-gui.cmd should use pythonw.exe"
          }
          if ($normalText -notmatch 'start "" ') {
            throw "launch-gui.cmd should use start without /B"
          }
          if ($normalText -match 'start "" /B') {
            throw "launch-gui.cmd should not keep the console with /B"
          }
          if ($normalText -notmatch 'exit /b 0') {
            throw "launch-gui.cmd should exit immediately after start"
          }
          $safeText = Get-Content $safe -Raw
          if ($safeText -notmatch "python\.exe") {
            throw "launch-gui-safe.cmd should use python.exe"
          }
          # pythonw 没有 stdout；--version 用兼容模式验证真实运行时。
          cmd /c "`"$safe`" --version"
          if ($LASTEXITCODE -ne 0) {
            throw "installed GUI launcher failed: $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui-bundle
          path: KarenBot-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: installer-linux-x64
            binary: KarenBot-Installer-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: installer-linux-arm64
            binary: KarenBot-Installer-linux-arm64
    runs-on: ${{ matrix.runner }}
    name: build-linux-${{ matrix.artifact }}
    timeout-minutes: 30
    container:
      image: ubuntu:22.04
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Build inside Ubuntu 22.04 (glibc 2.35) so the frozen binary also runs
      # on Debian 12 / Ubuntu 22.04+, not only on the 24.04 runner.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl python3 python3-venv python3-tk \
            libpython3.10 xvfb xauth fonts-dejavu-core binutils

      - uses: actions/checkout@v4

      - name: Create build venv with system Python
        run: |
          /usr/bin/python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install \
            -r requirements-build.txt -r requirements-test.txt
          .build-venv/bin/python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Core and packaging tests
        run: |
          .build-venv/bin/python -m pytest tests/test_installer.py \
            tests/test_windows_packaging.py -q

      - name: GUI flow smoke test
        run: |
          xvfb-run -a .build-venv/bin/python -m pytest \
            tests/test_installer_gui_flow.py -q
          xvfb-run -a .build-venv/bin/python gui_install.py --smoke-test

      - name: Build installer
        env:
          PYTHON: .build-venv/bin/python
        run: bash scripts/build_linux.sh

      - name: Enforce 60 MiB artifact limit
        run: |
          .build-venv/bin/python scripts/check_artifact_size.py \
            dist/KarenBot-Installer --max-mib 60

      - name: Smoke check frozen binary
        run: xvfb-run -a dist/KarenBot-Installer --smoke-test

      - name: Rename and checksum Linux binary
        run: |
          cp dist/KarenBot-Installer "dist/${{ matrix.binary }}"
          cd dist
          sha256sum "${{ matrix.binary }}" > "SHA256SUMS-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binary }}
            dist/SHA256SUMS-${{ matrix.artifact }}.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-windows-bundle, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: CN-BI5UNF/KarenBot
          ref: main
          path: personas-src
          sparse-checkout: personas

      - name: Build personas asset
        run: |
          cd personas-src
          zip -qr "$GITHUB_WORKSPACE/artifacts/KarenBot-Personas.zip" personas
          unzip -l "$GITHUB_WORKSPACE/artifacts/KarenBot-Personas.zip"

      - name: Compute release checksums
        run: |
          cd artifacts
          sha256sum \
            KarenBot-Installer.exe \
            KarenBot-Installer-linux-x64 \
            KarenBot-Installer-linux-arm64 \
            KarenBot-Windows-x64.zip \
            KarenBot-Personas.zip \
            > SHA256SUMS.txt
          cd ..
          # 安装器源码也写入清单，便于 KAREN_INSTALLER_SHA256 校验核心。
          sha256sum \
            karen_install.py \
            gui_install.py \
            install.sh \
            mirrors.json \
            windows-gui-package.json \
            >> artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "KarenBot Installer $tag" \
              --notes "Installer only; KarenBot packages are downloaded at install time."
          fi
          gh release upload "$tag" \
            artifacts/KarenBot-Installer.exe \
            artifacts/KarenBot-Installer-linux-x64 \
            artifacts/KarenBot-Installer-linux-arm64 \
            artifacts/KarenBot-Windows-x64.zip \
            artifacts/KarenBot-Personas.zip \
            artifacts/SHA256SUMS.txt \
            install.sh \
            --clobber
