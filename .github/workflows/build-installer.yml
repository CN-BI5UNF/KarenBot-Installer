name: Build Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "karen_install.py"
      - "gui_install.py"
      - "mirrors.json"
      - "KarenBot-Installer.spec"
      - "tests/**"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Installer tests
        run: python -m pytest tests/test_installer.py tests/test_installer_gui_contract.py -q

      - name: Ruff
        run: python -m ruff check karen_install.py gui_install.py tests/

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build installer
        run: python -m PyInstaller KarenBot-Installer.spec --noconfirm --clean

      - name: Smoke check frozen exe
        run: .\dist\KarenBot-Installer.exe --check

      - name: Capture Windows installer UI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\KarenBot-Installer.exe"
          $png = Join-Path $PWD "installer-ui.png"
          $pngLate = Join-Path $PWD "installer-ui-late.png"

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win32Capture {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          "@

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if (-not $process.HasExited) {
              $process.Refresh()
          }
          Write-Host "Launcher PID=$($process.Id) Exited=$($process.HasExited)"

          # PyInstaller onefile launches a child process which owns the Tk
          # window. Find the first process of this executable with a window.
          $gui = Get-Process -Name "KarenBot-Installer" -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } |
              Select-Object -First 1
          if ($gui) {
              Write-Host "GUI PID=$($gui.Id) Title=$($gui.MainWindowTitle)"
              [Win32Capture]::ShowWindow($gui.MainWindowHandle, 3) | Out-Null
              [Win32Capture]::SetForegroundWindow($gui.MainWindowHandle) | Out-Null
              Start-Sleep -Seconds 1
          } else {
              Write-Host "No GUI window handle found; capturing desktop anyway."
          }

          function Save-Screen([string]$path) {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                  $graphics.CopyFromScreen(
                      $bounds.Location,
                      [System.Drawing.Point]::Empty,
                      $bounds.Size
                  )
                  $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                  $graphics.Dispose()
                  $bitmap.Dispose()
              }
          }

          Save-Screen $png
          Start-Sleep -Seconds 3
          Save-Screen $pngLate
          Get-Process -Name "KarenBot-Installer" -ErrorAction SilentlyContinue |
              Stop-Process -Force
          Get-Item $png, $pngLate | Select-Object Name, Length | Format-Table

      - name: Upload Windows installer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-ui
          path: |
            installer-ui.png
            installer-ui-late.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: dist/KarenBot-Installer.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: installer-linux-x64
            binary: KarenBot-Installer-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: installer-linux-arm64
            binary: KarenBot-Installer-linux-arm64
    runs-on: ${{ matrix.runner }}
    name: build-linux-${{ matrix.artifact }}
    timeout-minutes: 25
    container:
      image: ubuntu:22.04
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Build inside Ubuntu 22.04 (glibc 2.35) so the frozen binary also runs
      # on Debian 12 / Ubuntu 22.04+, not only on the 24.04 runner.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv python3-tk \
            libpython3.10 xvfb xauth fonts-dejavu-core binutils

      - uses: actions/checkout@v4

      - name: Create build venv with system Python
        run: |
          /usr/bin/python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install pyinstaller pytest
          .build-venv/bin/python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: GUI smoke test from source
        run: |
          xvfb-run -a .build-venv/bin/python -m pytest tests/test_installer_gui_flow.py -q
          xvfb-run -a .build-venv/bin/python gui_install.py --smoke-test

      - name: Build installer
        run: .build-venv/bin/python -m PyInstaller KarenBot-Installer.spec --noconfirm --clean

      - name: Smoke check frozen binary
        run: xvfb-run -a dist/KarenBot-Installer --smoke-test

      - name: Rename Linux binary for release
        run: cp dist/KarenBot-Installer "dist/${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "KarenBot Installer $tag" --notes "Automated installer build."
          fi
          gh release upload "$tag" artifacts/* --clobber
